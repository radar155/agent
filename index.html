<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Test</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      transition: background-color 0.8s ease-in-out;
    }
    #app {
      height: 100%;
      display: flex;
    }
    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #16213e;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #333;
    }
    .sidebar-header button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4a69bd;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    .sidebar-header button:hover { background: #3c5aa6; }
    .thread-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .thread-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .thread-item:hover { background: #2d3436; }
    .thread-item.active { background: #4a69bd; color: white; }
    /* Main chat area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #4a69bd;
      white-space: pre-wrap;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #2d3436;
    }
    /* Markdown styles */
    .msg.assistant p { margin: 0; }
    .msg.assistant p + p { margin-top: 0.5em; }
    .msg.assistant code {
      background: #1a1a2e;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Consolas', monospace;
      font-size: 0.9em;
    }
    .msg.assistant pre {
      background: #1a1a2e;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.5em 0;
    }
    .msg.assistant pre code {
      background: none;
      padding: 0;
    }
    .msg.assistant ul, .msg.assistant ol {
      margin: 0.5em 0;
      padding-left: 20px;
    }
    .msg.assistant li { margin: 0; padding: 0; }
    .msg.assistant li p { margin: 0; display: inline; }
    .msg.assistant strong { color: #fff; }
    .msg.assistant a { color: #74b9ff; }
    .msg.assistant > *:first-child { margin-top: 0; }
    .msg.assistant > *:last-child { margin-bottom: 0; }
    .tool-execution {
      align-self: flex-start;
      background: #2d3436;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.85em;
      max-width: 80%;
    }
    .tool-call {
      border-left: 3px solid #f39c12;
      padding-left: 10px;
      margin-bottom: 6px;
    }
    .tool-result {
      border-left: 3px solid #27ae60;
      padding-left: 10px;
      opacity: 0.9;
    }
    .tool-name { color: #f39c12; font-weight: 600; }
    .tool-args { color: #888; font-size: 0.9em; }
    .input-area {
      display: flex;
      padding: 16px;
      gap: 12px;
      background: #16213e;
      border-top: 1px solid #333;
    }
    .input-area input {
      flex: 1;
      padding: 14px 18px;
      border: none;
      border-radius: 24px;
      background: #2d3436;
      color: #eee;
      font-size: 16px;
      outline: none;
    }
    .input-area input:focus { background: #3d4446; }
    .input-area input:disabled { opacity: 0.5; }
    .input-area button {
      padding: 14px 28px;
      border: none;
      border-radius: 24px;
      background: #4a69bd;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .input-area button:hover { background: #3c5aa6; }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="app">
    <chat-app></chat-app>
  </div>

  <script>
    const { createApp, ref, nextTick, defineComponent, onMounted } = Vue;
    const API_URL = 'http://localhost:3000';

    // ============================================
    // ADAPTER: converte history API → formato interno
    // ============================================
    function parseHistoryToMessages(langchainMessages) {
      const messages = [];
      const pendingToolCalls = new Map();

      for (const msg of langchainMessages) {
        const msgType = msg.id?.[2];
        const kwargs = msg.kwargs || {};

        if (msgType === 'HumanMessage') {
          messages.push({ type: 'user', content: kwargs.content || '' });
        }
        else if (msgType === 'AIMessageChunk' || msgType === 'AIMessage') {
          const toolCalls = kwargs.tool_calls || [];
          for (const tc of toolCalls) {
            const toolMsg = {
              type: 'tool',
              name: tc.name,
              args: tc.args || {},
              result: null
            };
            messages.push(toolMsg);
            pendingToolCalls.set(tc.id, toolMsg);
          }
          if (kwargs.content) {
            messages.push({ type: 'assistant', content: kwargs.content });
          }
        }
        else if (msgType === 'ToolMessage') {
          const toolCallId = kwargs.tool_call_id;
          const toolMsg = pendingToolCalls.get(toolCallId);
          if (toolMsg) {
            toolMsg.result = kwargs.content || '';
          }
        }
      }

      return messages;
    }

    // ============================================
    // COMPONENTI
    // ============================================

    const ToolExecution = defineComponent({
      name: 'ToolExecution',
      props: {
        name: { type: String, required: true },
        args: { type: Object, default: () => ({}) },
        result: { type: String, default: null }
      },
      template: `
        <div class="tool-execution">
          <div class="tool-call">
            🔧 <span class="tool-name">{{ name }}</span>
            <span class="tool-args">({{ formatArgs }})</span>
          </div>
          <div v-if="result" class="tool-result">
            ✅ {{ result }}
          </div>
        </div>
      `,
      computed: {
        formatArgs() {
          return JSON.stringify(this.args);
        }
      }
    });

    const ChatMessage = defineComponent({
      name: 'ChatMessage',
      props: {
        type: { type: String, required: true },
        content: { type: String, default: '' }
      },
      computed: {
        renderedContent() {
          if (this.type === 'assistant') {
            return marked.parse(this.content || '');
          }
          return this.content;
        }
      },
      template: `
        <div class="msg" :class="type" v-if="type === 'assistant'" v-html="renderedContent"></div>
        <div class="msg" :class="type" v-else>{{ content }}</div>
      `
    });

    // Sidebar con lista thread
    const ThreadSidebar = defineComponent({
      name: 'ThreadSidebar',
      props: {
        threads: { type: Array, default: () => [] },
        activeThreadId: { type: String, default: null }
      },
      emits: ['select', 'new'],
      template: `
        <div class="sidebar">
          <div class="sidebar-header">
            <button @click="$emit('new')">+ Nuova conversazione</button>
          </div>
          <div class="thread-list">
            <div
              v-for="thread in threads"
              :key="thread"
              class="thread-item"
              :class="{ active: thread === activeThreadId }"
              @click="$emit('select', thread)"
              :title="thread"
            >
              {{ thread }}
            </div>
          </div>
        </div>
      `
    });

    // Componente principale Chat
    const ChatApp = defineComponent({
      name: 'ChatApp',
      components: { ChatMessage, ToolExecution, ThreadSidebar },
      setup() {
        const messages = ref([]);
        const inputText = ref('');
        const isLoading = ref(false);
        const chatContainer = ref(null);
        const inputRef = ref(null);
        const threadId = ref(null);
        const threads = ref([]);

        const scrollToBottom = async () => {
          await nextTick();
          if (chatContainer.value) {
            chatContainer.value.scrollTop = chatContainer.value.scrollHeight;
          }
        };

        // Carica lista thread
        const loadThreads = async () => {
          try {
            const res = await fetch(`${API_URL}/threads`);
            const data = await res.json();
            threads.value = data.threads || [];
          } catch (err) {
            console.error('Errore caricamento threads:', err);
          }
        };

        // Seleziona un thread esistente
        const selectThread = async (id) => {
          if (id === threadId.value) return;
          
          isLoading.value = true;
          try {
            const res = await fetch(`${API_URL}/history/${id}`);
            const data = await res.json();
            
            threadId.value = data.threadId;
            messages.value = parseHistoryToMessages(data.messages || []);
            scrollToBottom();
          } catch (err) {
            console.error('Errore caricamento history:', err);
          }
          isLoading.value = false;
        };

        // Nuova conversazione
        const newConversation = () => {
          threadId.value = null;
          messages.value = [];
        };

        // Invia messaggio
        const sendMessage = async () => {
          const text = inputText.value.trim();
          if (!text || isLoading.value) return;

          messages.value.push({ type: 'user', content: text });
          inputText.value = '';
          isLoading.value = true;
          scrollToBottom();

          let currentAssistantIndex = null;

          try {
            const res = await fetch(`${API_URL}/chat`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                message: text, 
                threadId: threadId.value 
              })
            });

            const reader = res.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;

              const lines = decoder.decode(value).split('\n');
              for (const line of lines) {
                if (!line.startsWith('data: ')) continue;

                const event = JSON.parse(line.slice(6));

                if (event.type === 'thread_id') {
                  const isNew = !threadId.value;
                  threadId.value = event.threadId;
                  // Se è un nuovo thread, aggiorna la lista
                  if (isNew) {
                    threads.value = [event.threadId, ...threads.value];
                  }
                }
                else if (event.type === 'token') {
                  if (currentAssistantIndex === null) {
                    messages.value.push({ type: 'assistant', content: '' });
                    currentAssistantIndex = messages.value.length - 1;
                  }
                  messages.value[currentAssistantIndex].content += event.content;
                  scrollToBottom();
                }
                else if (event.type === 'tool_call') {
                  currentAssistantIndex = null;
                  messages.value.push({
                    type: 'tool',
                    name: event.name,
                    args: event.args,
                    result: null
                  });
                  scrollToBottom();
                }
                else if (event.type === 'tool_result') {
                  const lastTool = [...messages.value].reverse().find(m => m.type === 'tool');
                  if (lastTool) {
                    lastTool.result = event.content;
                  }
                  scrollToBottom();
                }
                else if (event.type === 'ui_action') {
                  if (event.action === 'change_background' && event.payload?.color) {
                    document.body.style.backgroundColor = event.payload.color;
                  }
                }
                else if (event.type === 'error') {
                  messages.value.push({ type: 'assistant', content: `❌ Errore: ${event.message}` });
                  scrollToBottom();
                }
              }
            }
          } catch (err) {
            messages.value.push({ type: 'assistant', content: `❌ Errore di connessione: ${err.message}` });
          }

          isLoading.value = false;
          scrollToBottom();
          await nextTick();
          inputRef.value?.focus();
        };

        const handleKeydown = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        };

        onMounted(() => {
          loadThreads();
        });

        return {
          messages,
          inputText,
          isLoading,
          chatContainer,
          inputRef,
          threadId,
          threads,
          sendMessage,
          handleKeydown,
          selectThread,
          newConversation
        };
      },
      template: `
        <thread-sidebar
          :threads="threads"
          :active-thread-id="threadId"
          @select="selectThread"
          @new="newConversation"
        />
        <div class="main">
          <div class="chat" ref="chatContainer">
            <div v-if="messages.length === 0" class="empty-state">
              Inizia una nuova conversazione
            </div>
            <template v-else v-for="(msg, index) in messages" :key="index">
              <tool-execution
                v-if="msg.type === 'tool'"
                :name="msg.name"
                :args="msg.args"
                :result="msg.result"
              />
              <chat-message
                v-else
                :type="msg.type"
                :content="msg.content"
              />
            </template>
          </div>
          <div class="input-area">
            <input
              ref="inputRef"
              v-model="inputText"
              type="text"
              placeholder="Scrivi un messaggio..."
              :disabled="isLoading"
              @keydown="handleKeydown"
              autofocus
            >
            <button @click="sendMessage" :disabled="isLoading">Invia</button>
          </div>
        </div>
      `
    });

    const app = createApp({});
    app.component('ChatApp', ChatApp);
    app.mount('#app');
  </script>
</body>
</html>
