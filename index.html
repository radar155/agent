<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Agent</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
    }
    #app { height: 100%; display: flex; }
    
    .sidebar {
      width: 260px;
      background: #16213e;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #333; }
    .sidebar-header button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4a69bd;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    .sidebar-header button:hover { background: #3c5aa6; }
    .thread-list { flex: 1; overflow-y: auto; padding: 8px; }
    .thread-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .thread-item:hover { background: #2d3436; }
    .thread-item.active { background: #4a69bd; color: white; }
    
    .main { flex: 1; display: flex; flex-direction: column; }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .msg {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.6;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #4a69bd;
      white-space: pre-wrap;
    }
    
    /* Assistant turn - un unico contenitore */
    .assistant-turn {
      align-self: flex-start;
      max-width: 85%;
      background: #2d3436;
      border-radius: 16px;
      padding: 14px 18px;
      line-height: 1.6;
    }
    
    /* Tool inline nel messaggio */
    .tool-block {
      background: #252535;
      border-radius: 8px;
      padding: 10px 12px;
      margin: 10px 0;
      font-size: 0.9em;
    }
    .tool-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tool-icon { font-size: 1em; }
    .tool-name { color: #f39c12; font-weight: 600; }
    .tool-details { margin-top: 6px; padding-left: 20px; }
    .tool-path { color: #74b9ff; font-family: 'Consolas', monospace; font-size: 0.9em; }
    .tool-description { color: #bbb; font-size: 0.9em; margin-top: 2px; font-style: italic; }
    .tool-status {
      margin-top: 6px;
      padding-left: 20px;
      font-size: 0.85em;
    }
    .tool-status.generating { color: #9b59b6; font-style: italic; }
    .tool-status.running { color: #888; font-style: italic; }
    .tool-status.done { color: #27ae60; }

    /* Thinking block */
    .thinking-block {
      background: #1e1e30;
      border-left: 3px solid #9b59b6;
      border-radius: 4px;
      padding: 8px 12px;
      margin: 6px 0;
      color: #a89cc8;
      font-size: 0.85em;
      font-style: italic;
      line-height: 1.5;
    }
    .thinking-label {
      color: #9b59b6;
      font-size: 0.8em;
      font-weight: 600;
      margin-bottom: 4px;
      font-style: normal;
    }
    
    /* Chart */
    .chart-container {
      background: #252535;
      border-radius: 8px;
      padding: 16px;
      margin: 10px 0;
    }
    .chart-title {
      color: #fff;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
    }
    .chart-canvas {
      max-height: 300px;
    }
    
    /* HTML Iframe */
    .html-render-container {
      background: #252535;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
    }
    .html-render-title {
      color: #fff;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9em;
    }
    .html-frame {
      width: 100%;
      border: none;
      border-radius: 4px;
      background: #fff;
      overflow: hidden;
    }
    
    /* File Downloads */
    .files-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .file-download {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #3d5a80;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.85em;
      transition: background 0.2s;
    }
    .file-download:hover {
      background: #4a69bd;
    }
    .file-download svg {
      width: 16px;
      height: 16px;
    }
    
    /* Markdown */
    .assistant-turn p { margin: 0; }
    .assistant-turn p + p { margin-top: 0.5em; }
    .assistant-turn code {
      background: #1a1a2e;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Consolas', monospace;
      font-size: 0.9em;
    }
    .assistant-turn pre {
      background: #1a1a2e;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.5em 0;
    }
    .assistant-turn pre code { background: none; padding: 0; }
    .assistant-turn ul, .assistant-turn ol { margin: 0.5em 0; padding-left: 20px; }
    .assistant-turn li { margin: 0; padding: 0; }
    .assistant-turn strong { color: #fff; }
    .assistant-turn a { color: #74b9ff; }
    
    .input-area {
      display: flex;
      padding: 16px;
      gap: 12px;
      background: #16213e;
      border-top: 1px solid #333;
    }
    .input-area input {
      flex: 1;
      padding: 14px 18px;
      border: none;
      border-radius: 24px;
      background: #2d3436;
      color: #eee;
      font-size: 16px;
      outline: none;
    }
    .input-area input:focus { background: #3d4446; }
    .input-area input:disabled { opacity: 0.5; }
    .input-area button {
      padding: 14px 28px;
      border: none;
      border-radius: 24px;
      background: #4a69bd;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .input-area button:hover { background: #3c5aa6; }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 18px;
    }
    .loading-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #4a69bd;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="app">
    <chat-app></chat-app>
  </div>

  <script>
    const { createApp, ref, reactive, nextTick, defineComponent, onMounted, computed } = Vue;
    const API_URL = 'http://localhost:3000';

    // Converte history API → formato interno
    function parseHistoryToMessages(langchainMessages) {
      const messages = [];
      let currentItems = null;
      let currentText = '';
      const toolMap = new Map();

      const flushText = () => {
        if (currentText) {
          if (!currentItems) currentItems = [];
          currentItems.push({ type: 'text', content: currentText });
          currentText = '';
        }
      };

      for (const msg of langchainMessages) {
        const msgType = msg.id?.[2];
        const kwargs = msg.kwargs || {};

        if (msgType === 'HumanMessage') {
          flushText();
          if (currentItems) {
            messages.push({ type: 'assistant-turn', items: currentItems });
            currentItems = null;
          }
          messages.push({ type: 'user', content: kwargs.content || '' });
        }
        else if (msgType === 'AIMessageChunk' || msgType === 'AIMessage') {
          if (!currentItems) currentItems = [];
          
          // Accumula testo (potrebbe arrivare in più chunk)
          if (kwargs.content && typeof kwargs.content === 'string') {
            currentText += kwargs.content;
          }
          
          // Tool calls - prima flush del testo accumulato
          const toolCalls = kwargs.tool_calls || [];
          if (toolCalls.length > 0) {
            flushText();
            for (const tc of toolCalls) {
              const toolEntry = { type: 'tool', id: tc.id, name: tc.name, args: tc.args || {}, result: null, isComplete: true };
              currentItems.push(toolEntry);
              toolMap.set(tc.id, toolEntry);
            }
          }
        }
        else if (msgType === 'ToolMessage') {
          const toolEntry = toolMap.get(kwargs.tool_call_id);
          if (toolEntry) {
            toolEntry.result = kwargs.content || '';
          }
        }
      }
      flushText();
      if (currentItems) messages.push({ type: 'assistant-turn', items: currentItems });
      return messages;
    }

    const ThreadSidebar = defineComponent({
      name: 'ThreadSidebar',
      props: {
        threads: { type: Array, default: () => [] },
        activeThreadId: { type: String, default: null }
      },
      emits: ['select', 'new'],
      template: `
        <div class="sidebar">
          <div class="sidebar-header">
            <button @click="$emit('new')">+ Nuova conversazione</button>
          </div>
          <div class="thread-list">
            <div v-for="thread in threads" :key="thread"
              class="thread-item" :class="{ active: thread === activeThreadId }"
              @click="$emit('select', thread)" :title="thread">
              {{ thread }}
            </div>
          </div>
        </div>
      `
    });

    const AssistantTurn = defineComponent({
      name: 'AssistantTurn',
      props: {
        items: { type: Array, default: () => [] },
        isStreaming: { type: Boolean, default: false }
      },
      data() {
        return { API_URL };
      },
      computed: {
        hasContent() {
          return this.items.length > 0;
        }
      },
      methods: {
        renderMarkdown(content) {
          return marked.parse(content || '');
        },
        truncate(str, len) {
          return str && str.length > len ? str.substring(0, len) + '...' : str;
        },
        getToolStatus(tool) {
          if (tool.result !== null) return 'done';
          if (!tool.isComplete) return 'generating';
          return 'running';
        },
        parseChartFromResult(result) {
          try {
            const parsed = JSON.parse(result);
            if (parsed.success && parsed.chart) {
              return parsed.chart;
            }
          } catch {}
          return null;
        },
        parseHtmlFromResult(result) {
          try {
            const parsed = JSON.parse(result);
            if (parsed.type === 'html' && parsed.html) {
              // Inietta script minimo per comunicare altezza al load
              const resizeScript = `<script>window.onload=()=>parent.postMessage({h:document.body.scrollHeight},'*')<\/script>`;
              let html = parsed.html;
              if (html.includes('</body>')) {
                html = html.replace('</body>', resizeScript + '</body>');
              } else {
                html = html + resizeScript;
              }
              return { ...parsed, html };
            }
          } catch {}
          return null;
        },
        parseFilesFromResult(result) {
          try {
            const parsed = JSON.parse(result);
            if (parsed.success && parsed.files && Array.isArray(parsed.files)) {
              return parsed.files;
            }
          } catch {}
          return null;
        }
      },
      mounted() {
        this.renderCharts();
      },
      updated() {
        this.renderCharts();
      },
      setup() {
        const chartInstances = new Map();
        
        const renderCharts = function() {
          nextTick(() => {
            const canvases = document.querySelectorAll('.chart-canvas:not([data-rendered])');
            canvases.forEach(canvas => {
              const chartData = canvas.dataset.chart;
              if (!chartData) return;
              
              try {
                const chart = JSON.parse(chartData);
                canvas.setAttribute('data-rendered', 'true');
                
                const colors = [
                  'rgba(74, 105, 189, 0.8)',
                  'rgba(39, 174, 96, 0.8)',
                  'rgba(243, 156, 18, 0.8)',
                  'rgba(155, 89, 182, 0.8)',
                  'rgba(231, 76, 60, 0.8)',
                  'rgba(52, 152, 219, 0.8)',
                ];
                
                const datasets = chart.data.datasets.map((ds, i) => ({
                  ...ds,
                  backgroundColor: chart.chartType === 'pie' 
                    ? colors.slice(0, ds.data.length)
                    : colors[i % colors.length],
                  borderColor: chart.chartType === 'line' ? colors[i % colors.length] : undefined,
                  borderWidth: chart.chartType === 'line' ? 2 : 1,
                }));
                
                new Chart(canvas, {
                  type: chart.chartType,
                  data: { labels: chart.data.labels, datasets },
                  options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                      legend: { labels: { color: '#eee' } }
                    },
                    scales: chart.chartType !== 'pie' ? {
                      x: { ticks: { color: '#aaa' }, grid: { color: '#333' } },
                      y: { ticks: { color: '#aaa' }, grid: { color: '#333' } }
                    } : undefined
                  }
                });
              } catch (e) {
                console.error('Chart render error:', e);
              }
            });
          });
        };
        
        return { renderCharts };
      },
      template: `
        <div class="assistant-turn" v-if="hasContent || isStreaming">
          <template v-for="(item, i) in items" :key="i">
            <div v-if="item.type === 'thinking'" class="thinking-block">
              <div class="thinking-label">💭 Ragionamento</div>
              {{ item.content }}
            </div>

            <div v-else-if="item.type === 'text'" v-html="renderMarkdown(item.content)"></div>
            
            <div v-else-if="item.type === 'tool'" class="tool-block">
              <div class="tool-header">
                <span class="tool-icon">🔧</span>
                <span class="tool-name">{{ item.name }}</span>
              </div>
              <div v-if="item.args" class="tool-details">
                <div v-if="item.args.path" class="tool-path">📄 {{ item.args.path }}</div>
                <div v-if="item.name === 'create_file' && item.args.description" class="tool-description">{{ item.args.description }}</div>
                <div v-if="item.name === 'bash' && item.args.command" class="tool-path">$ {{ item.args.command }}</div>
                <div v-if="item.name === 'web_fetch' && item.args.url" class="tool-path">🌐 {{ item.args.url }}</div>
                <div v-if="item.name === 'chart_display' && item.args.title" class="tool-description">📊 {{ item.args.title }}</div>
                <div v-if="item.name === 'render_html' && item.args.title" class="tool-description">🖼 {{ item.args.title }}</div>
              </div>
              
              <!-- Chart rendering -->
              <template v-if="item.name === 'chart_display' && item.result">
                <div v-if="parseChartFromResult(item.result)" class="chart-container">
                  <div v-if="parseChartFromResult(item.result).title" class="chart-title">
                    {{ parseChartFromResult(item.result).title }}
                  </div>
                  <canvas class="chart-canvas" :data-chart="JSON.stringify(parseChartFromResult(item.result))"></canvas>
                </div>
                <div v-else class="tool-status done">✅ {{ truncate(item.result, 150) }}</div>
              </template>
              
              <!-- HTML iframe rendering -->
              <template v-else-if="item.name === 'render_html' && item.result">
                <div v-if="parseHtmlFromResult(item.result)" class="html-render-container">
                  <div v-if="parseHtmlFromResult(item.result).title" class="html-render-title">
                    {{ parseHtmlFromResult(item.result).title }}
                  </div>
                  <iframe 
                    class="html-frame" 
                    :srcdoc="parseHtmlFromResult(item.result).html"
                    sandbox="allow-scripts"
                  ></iframe>
                </div>
                <div v-else class="tool-status done">✅ {{ truncate(item.result, 150) }}</div>
              </template>
              
              <!-- File downloads rendering -->
              <template v-else-if="item.name === 'present_files' && item.result">
                <div v-if="parseFilesFromResult(item.result)" class="files-container">
                  <a v-for="file in parseFilesFromResult(item.result)" :key="file.filename"
                     class="file-download" :href="API_URL + file.downloadUrl" :download="file.filename" target="_blank" rel="noopener">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                      <polyline points="7 10 12 15 17 10"></polyline>
                      <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    {{ file.filename }}
                  </a>
                </div>
                <div v-else class="tool-status done">✅ {{ truncate(item.result, 150) }}</div>
              </template>
              
              <template v-else>
                <div class="tool-status" :class="getToolStatus(item)">
                  <template v-if="item.result !== null">✅ {{ truncate(item.result, 150) }}</template>
                  <template v-else-if="!item.isComplete">⏳ Generando...</template>
                  <template v-else>⏳ In esecuzione...</template>
                </div>
              </template>
            </div>
          </template>
          
          <span v-if="isStreaming && !hasContent" class="loading-indicator"></span>
        </div>
      `
    });

    const ChatApp = defineComponent({
      name: 'ChatApp',
      components: { ThreadSidebar, AssistantTurn },
      setup() {
        const messages = ref([]);
        const inputText = ref('');
        const isLoading = ref(false);
        const chatContainer = ref(null);
        const inputRef = ref(null);
        const threadId = ref(null);
        const threads = ref([]);
        
        // Turno corrente: array di items in ordine cronologico
        const currentTurn = reactive({ items: [], active: false });
        
        // Mappa per trovare tool per id
        const toolsById = new Map();

        const scrollToBottom = async () => {
          await nextTick();
          if (chatContainer.value) {
            chatContainer.value.scrollTop = chatContainer.value.scrollHeight;
          }
        };

        const loadThreads = async () => {
          try {
            const res = await fetch(`${API_URL}/threads`);
            const data = await res.json();
            threads.value = data.threads || [];
          } catch (err) {
            console.error('Errore caricamento threads:', err);
          }
        };

        const selectThread = async (id) => {
          if (id === threadId.value) return;
          isLoading.value = true;
          try {
            const res = await fetch(`${API_URL}/history/${id}`);
            const data = await res.json();
            threadId.value = data.threadId;
            messages.value = parseHistoryToMessages(data.messages || []);
            scrollToBottom();
          } catch (err) {
            console.error('Errore caricamento history:', err);
          }
          isLoading.value = false;
        };

        const newConversation = () => {
          threadId.value = null;
          messages.value = [];
        };

        // Trova o crea l'ultimo item di testo
        const getOrCreateTextItem = () => {
          const lastItem = currentTurn.items[currentTurn.items.length - 1];
          if (lastItem?.type === 'text') {
            return lastItem;
          }
          const newItem = { type: 'text', content: '' };
          currentTurn.items.push(newItem);
          return newItem;
        };

        // Trova o crea l'ultimo item di thinking
        const getOrCreateThinkingItem = () => {
          const lastItem = currentTurn.items[currentTurn.items.length - 1];
          if (lastItem?.type === 'thinking') {
            return lastItem;
          }
          const newItem = { type: 'thinking', content: '' };
          currentTurn.items.push(newItem);
          return newItem;
        };

        // Trova un tool esistente o lo crea nella posizione corretta
        const getOrCreateTool = (id, name, args, isComplete) => {
          let tool = toolsById.get(id);
          if (tool) {
            // Aggiorna tool esistente — muta in-place per reattività Vue
            if (args && Object.keys(args).length > 0) {
              Object.assign(tool.args, args);
            }
            tool.isComplete = isComplete;
            return tool;
          }
          
          // Crea nuovo tool
          tool = reactive({
            type: 'tool',
            id,
            name,
            args: args || {},
            result: null,
            isComplete
          });
          currentTurn.items.push(tool);
          toolsById.set(id, tool);
          return tool;
        };

        const sendMessage = async () => {
          const text = inputText.value.trim();
          if (!text || isLoading.value) return;

          messages.value.push({ type: 'user', content: text });
          inputText.value = '';
          isLoading.value = true;
          
          currentTurn.items = [];
          currentTurn.active = true;
          toolsById.clear();
          
          scrollToBottom();

          try {
            const res = await fetch(`${API_URL}/chat`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: text, threadId: threadId.value })
            });

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;

              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split('\n');
              buffer = lines.pop() || ''; // Mantieni l'ultima linea incompleta

              for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                
                let event;
                try {
                  event = JSON.parse(line.slice(6));
                } catch { continue; }

                if (event.type === 'thread_id') {
                  const isNew = !threadId.value;
                  threadId.value = event.threadId;
                  if (isNew) threads.value = [event.threadId, ...threads.value];
                }
                else if (event.type === 'token') {
                  const textItem = getOrCreateTextItem();
                  textItem.content += event.content;
                  scrollToBottom();
                }
                else if (event.type === 'thinking') {
                  const thinkingItem = getOrCreateThinkingItem();
                  thinkingItem.content += event.content;
                  scrollToBottom();
                }
                else if (event.type === 'tool_call') {
                  getOrCreateTool(event.id, event.name, event.args, event.isComplete);
                  scrollToBottom();
                }
                else if (event.type === 'tool_result') {
                  const tool = toolsById.get(event.id);
                  if (tool) tool.result = event.content;
                  scrollToBottom();
                }
                else if (event.type === 'error') {
                  const textItem = getOrCreateTextItem();
                  textItem.content += `\n\n❌ Errore: ${event.message}`;
                  scrollToBottom();
                }
                else if (event.type === 'done') {
                  if (currentTurn.items.length > 0) {
                    messages.value.push({
                      type: 'assistant-turn',
                      items: [...currentTurn.items]
                    });
                  }
                  currentTurn.items = [];
                  currentTurn.active = false;
                  toolsById.clear();
                }
              }
            }
          } catch (err) {
            const textItem = getOrCreateTextItem();
            textItem.content += `\n\n❌ Errore di connessione: ${err.message}`;
          }

          if (currentTurn.active && currentTurn.items.length > 0) {
            messages.value.push({
              type: 'assistant-turn',
              items: [...currentTurn.items]
            });
          }
          currentTurn.items = [];
          currentTurn.active = false;
          toolsById.clear();

          isLoading.value = false;
          scrollToBottom();
          await nextTick();
          inputRef.value?.focus();
        };

        const handleKeydown = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        };

        onMounted(() => { 
          loadThreads();
          window.addEventListener('message', e => {
            if (e.data?.h) {
              document.querySelectorAll('.html-frame').forEach(f => {
                if (f.contentWindow === e.source) f.style.height = e.data.h + 20 + 'px';
              });
            }
          });
        });

        return {
          messages, inputText, isLoading, chatContainer, inputRef,
          threadId, threads, currentTurn,
          sendMessage, handleKeydown, selectThread, newConversation
        };
      },
      template: `
        <thread-sidebar :threads="threads" :active-thread-id="threadId"
          @select="selectThread" @new="newConversation" />
        <div class="main">
          <div class="chat" ref="chatContainer">
            <div v-if="messages.length === 0 && !currentTurn.active" class="empty-state">
              Inizia una nuova conversazione
            </div>
            <template v-for="(msg, index) in messages" :key="index">
              <div v-if="msg.type === 'user'" class="msg user">{{ msg.content }}</div>
              <assistant-turn v-else-if="msg.type === 'assistant-turn'" :items="msg.items" />
            </template>
            <assistant-turn v-if="currentTurn.active" :items="currentTurn.items" :is-streaming="true" />
          </div>
          <div class="input-area">
            <input ref="inputRef" v-model="inputText" type="text"
              placeholder="Scrivi un messaggio..." :disabled="isLoading"
              @keydown="handleKeydown" autofocus>
            <button @click="sendMessage" :disabled="isLoading">Invia</button>
          </div>
        </div>
      `
    });

    const app = createApp({});
    app.component('ChatApp', ChatApp);
    app.mount('#app');
  </script>
</body>
</html>
