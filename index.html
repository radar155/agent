<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: #4a69bd;
    }
    .assistant {
      align-self: flex-start;
      background: #2d3436;
    }
    .tool {
      align-self: flex-start;
      background: #2d3436;
      border-left: 3px solid #f39c12;
      font-size: 0.85em;
      opacity: 0.9;
    }
    .tool-result {
      border-left-color: #27ae60;
    }
    #input-area {
      display: flex;
      padding: 16px;
      gap: 12px;
      background: #16213e;
      border-top: 1px solid #333;
    }
    #input {
      flex: 1;
      padding: 14px 18px;
      border: none;
      border-radius: 24px;
      background: #2d3436;
      color: #eee;
      font-size: 16px;
      outline: none;
    }
    #input:focus { background: #3d4446; }
    #input:disabled { opacity: 0.5; }
    #send {
      padding: 14px 28px;
      border: none;
      border-radius: 24px;
      background: #4a69bd;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #send:hover { background: #3c5aa6; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <div id="input-area">
    <input type="text" id="input" placeholder="Scrivi un messaggio..." autofocus>
    <button id="send">Invia</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const API_URL = 'http://localhost:3000';
    let threadId = 'chat-' + Date.now();

    function addMessage(content, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.textContent = content;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function setLoading(loading) {
      input.disabled = loading;
      sendBtn.disabled = loading;
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';
      setLoading(true);

      let assistantDiv = null;
      let assistantText = '';

      try {
        const res = await fetch(`${API_URL}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, threadId })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const lines = decoder.decode(value).split('\n');
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            
            const event = JSON.parse(line.slice(6));

            if (event.type === 'token') {
              if (!assistantDiv) {
                assistantDiv = addMessage('', 'assistant');
              }
              assistantText += event.content;
              assistantDiv.textContent = assistantText;
              chat.scrollTop = chat.scrollHeight;
            } 
            else if (event.type === 'tool_call') {
              addMessage(`🔧 ${event.name}(${JSON.stringify(event.args)})`, 'tool');
            } 
            else if (event.type === 'tool_result') {
              addMessage(`✅ ${event.content}`, 'tool tool-result');
            }
            else if (event.type === 'error') {
              addMessage(`❌ Errore: ${event.message}`, 'tool');
            }
          }
        }
      } catch (err) {
        addMessage(`❌ Errore di connessione: ${err.message}`, 'tool');
      }

      setLoading(false);
      input.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
